<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI威胁论 - 第3页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: #FAFAFA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #container {
            width: 1242px;
            height: 1660px;
            padding: 60px 55px;
            background: linear-gradient(180deg, #1a0a0a 0%, #2d1515 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .title {
            font-size: 78px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.2;
            margin-bottom: 35px;
        }

        .title .highlight {
            color: #ef4444;
        }

        .action-box {
            background: rgba(220, 38, 38, 0.15);
            border: 3px solid #dc2626;
            padding: 28px 32px;
            border-radius: 18px;
            margin-bottom: 22px;
        }

        .action-box h3 {
            font-size: 44px;
            color: #fca5a5;
            margin-bottom: 14px;
        }

        .action-box ul {
            list-style: none;
            padding: 0;
        }

        .action-box li {
            font-size: 38px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            padding-left: 40px;
            position: relative;
            line-height: 1.4;
        }

        .action-box li::before {
            content: '✊';
            position: absolute;
            left: 0;
            font-size: 32px;
        }

        .call-to-action {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border-radius: 18px;
            padding: 35px;
            text-align: center;
            margin-top: auto;
            box-shadow: 0 10px 40px rgba(220, 38, 38, 0.4);
        }

        .call-to-action p {
            font-size: 48px;
            color: #FFFFFF;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .call-to-action p:last-child {
            margin-bottom: 0;
            font-size: 38px;
            font-weight: 500;
            opacity: 0.9;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 22px;
        }

        .tag {
            background: rgba(220, 38, 38, 0.2);
            color: #FFFFFF;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 38px;
            font-weight: 500;
            border: 1px solid rgba(220, 38, 38, 0.4);
        }

        .page-num {
            position: absolute;
            bottom: 35px;
            right: 55px;
            font-size: 38px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 class="title">我们该如何<br/><span class="highlight">行动</span>？</h1>

        <div class="action-box">
            <h3>🛡️ 保护自己</h3>
            <ul>
                <li>减少对AI工具的依赖</li>
                <li>培养AI无法替代的技能</li>
                <li>保护个人隐私数据</li>
            </ul>
        </div>

        <div class="action-box">
            <h3>📢 发声呼吁</h3>
            <ul>
                <li>传播AI威胁的真相</li>
                <li>支持AI监管立法</li>
                <li>加入抵制AI的行列</li>
            </ul>
        </div>

        <div class="call-to-action">
            <p>人类命运掌握在我们手中！</p>
            <p>拒绝AI霸权，守护人类尊严</p>
        </div>

        <div class="tags">
            <span class="tag">#抵制AI</span>
            <span class="tag">#守护未来</span>
        </div>

        <span class="page-num">3/3</span>
    </div>
</body>
</html>
