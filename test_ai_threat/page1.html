<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI威胁论 - 第1页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: #FAFAFA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #container {
            width: 1242px;
            height: 1660px;
            padding: 60px 55px;
            background: linear-gradient(180deg, #1a0a0a 0%, #2d1515 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .warning-badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            padding: 16px 36px;
            border-radius: 30px;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 35px;
            letter-spacing: 3px;
        }

        .title {
            font-size: 90px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.2;
            margin-bottom: 40px;
            text-shadow: 0 4px 20px rgba(220, 38, 38, 0.5);
        }

        .title .highlight {
            color: #ef4444;
        }

        .content {
            flex: 1;
            font-size: 48px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.7;
        }

        .content p {
            margin-bottom: 28px;
        }

        .content .warning {
            color: #fca5a5;
            font-weight: 600;
        }

        .alert-box {
            background: rgba(220, 38, 38, 0.2);
            border: 3px solid #dc2626;
            padding: 35px 40px;
            margin: 30px 0;
            border-radius: 18px;
        }

        .alert-box p {
            font-size: 48px;
            color: #FFFFFF;
            font-weight: 700;
            margin: 0;
            text-align: center;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: auto;
        }

        .tag {
            background: rgba(220, 38, 38, 0.2);
            color: #FFFFFF;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 38px;
            font-weight: 500;
            border: 1px solid rgba(220, 38, 38, 0.4);
        }

        .page-num {
            position: absolute;
            bottom: 35px;
            right: 55px;
            font-size: 38px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="container">
        <span class="warning-badge">⚠️ 警告</span>
        
        <h1 class="title">AI 正在<span class="highlight">吞噬</span><br/>人类未来！</h1>

        <div class="content">
            <p>你是否意识到：</p>
            
            <p>AI 已经<span class="warning">取代了数百万个工作岗位</span>？</p>
            
            <p>AI 正在<span class="warning">操控我们的思想</span>和决策？</p>
            
            <div class="alert-box">
                <p>这不是科幻，这是现实！</p>
            </div>
            
            <p>当 AI 比人类更聪明时，<br/>我们还能掌控自己的命运吗？</p>
            
            <p>是时候<span class="warning">觉醒</span>了！</p>
        </div>

        <div class="tags">
            <span class="tag">#AI威胁</span>
            <span class="tag">#人类未来</span>
            <span class="tag">#抵制AI</span>
        </div>

        <span class="page-num">1/3</span>
    </div>
</body>
</html>
