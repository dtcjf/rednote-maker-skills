<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #F5E6D3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        #container {
            width: 1080px;
            height: 1080px;
            padding: 80px 60px;
            background: #FFFDF8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(139, 69, 19, 0.2);
            text-align: center;
        }

        /* 封面标题 */
        .cover-title {
            font-size: 96px;
            font-weight: bold;
            color: #8B4513;
            line-height: 1.3;
            margin-bottom: 50px;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
        }

        /* 副标题 */
        .cover-subtitle {
            font-size: 42px;
            color: #4A4A4A;
            line-height: 1.5;
            margin-bottom: 80px;
            max-width: 850px;
        }

        /* 封面标签 */
        .cover-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        .cover-tag {
            background: #8B4513;
            color: #FFFDF8;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 32px;
            font-weight: 600;
        }

        /* 底部 */
        .cover-footer {
            margin-top: auto;
            padding-top: 40px;
            color: #B22222;
            font-size: 24px;
            text-decoration: underline;
            text-decoration-color: #B22222;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 class="cover-title">复古信纸标题</h1>

        <p class="cover-subtitle">复古信纸风格的副标题，适合文艺复古类内容</p>

        <div class="cover-tags">
            <span class="cover-tag">#文艺</span>
            <span class="cover-tag">#复古</span>
            <span class="cover-tag">#怀旧</span>
        </div>

        <div class="cover-footer">小红书</div>
    </div>
</body>
</html>
