<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #FAFAFA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        #container {
            width: 1080px;
            height: 1080px;
            /* 封面使用 1:1 比例，这是小红书标准封面尺寸 */
            padding: 80px 60px;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        /* 封面标题 */
        .cover-title {
            font-size: 96px;
            font-weight: bold;
            color: #1A1A1A;
            line-height: 1.3;
            margin-bottom: 50px;
            position: relative;
            padding-left: 30px;
            border-left: 8px solid #1A1A1A;
            text-align: left;
        }

        /* 副标题 */
        .cover-subtitle {
            font-size: 42px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 80px;
            max-width: 900px;
            text-align: left;
        }

        /* 封面标签 */
        .cover-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: flex-start;
        }

        .cover-tag {
            background: #1A1A1A;
            color: #FFFFFF;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: 600;
        }

        /* 底部 */
        .cover-footer {
            margin-top: auto;
            padding-top: 40px;
            color: #999;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 class="cover-title">封面标题</h1>

        <p class="cover-subtitle">这里是副标题，可以添加一些有趣的描述来吸引读者</p>

        <div class="cover-tags">
            <span class="cover-tag">#话题1</span>
            <span class="cover-tag">#话题2</span>
        </div>

        <div class="cover-footer">小红书</div>
    </div>
</body>
</html>
