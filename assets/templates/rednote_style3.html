<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书图文</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 50%, #FECFEF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        #container {
            width: 1242px;
            height: 1660px;
            padding: 70px 60px;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 154, 158, 0.3);
        }

        /* 标题 */
        .title {
            font-size: 54px;
            font-weight: 800;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.4;
            margin-bottom: 40px;
            text-align: center;
        }

        /* 内容 */
        .content {
            font-size: 44px;
            color: #555555;
            line-height: 1.9;
            flex: 1;
            text-align: center;
        }

        .content p, .content br {
            margin-bottom: 22px;
        }

        /* 重点内容 */
        .content .highlight {
            color: #FF6B6B;
            font-weight: bold;
            background: linear-gradient(transparent 60%, rgba(255,107,107,0.2) 60%);
        }

        .content .tip {
            color: #FF8E53;
            font-weight: bold;
        }

        .content .note {
            color: #FFB6C1;
            font-weight: bold;
        }

        /* 标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            justify-content: center;
        }

        .tag {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 12px 26px;
            border-radius: 25px;
            font-size: 24px;
            font-weight: 500;
        }

        /* 底部 */
        .footer {
            margin-top: auto;
            padding-top: 30px;
            text-align: center;
            color: #FF6B6B;
            font-size: 24px;
            font-weight: 500;
        }

        /* 页码 */
        .page-num {
            position: absolute;
            bottom: 25px;
            right: 50px;
            font-size: 26px;
            color: #999;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 class="title">标题标题标题</h1>

        <div class="content">
            <p>正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容正文内容。</p>
        </div>

        <div class="tags">
            <span class="tag">#话题1</span>
            <span class="tag">#话题2</span>
            <span class="tag">#话题3</span>
        </div>

        <div class="footer">
            ❤️ 小红书
        </div>

        <span class="page-num">1/1</span>
    </div>
</body>
</html>
