<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #2C2C2C;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        #container {
            width: 1080px;
            height: 1080px;
            padding: 80px 60px;
            background: #F5F5DC;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* 封面标题 */
        .cover-title {
            font-size: 96px;
            font-weight: bold;
            color: #1A1A1A;
            line-height: 1.3;
            margin-bottom: 50px;
            position: relative;
        }

        .cover-title::after {
            content: '';
            display: block;
            width: 200px;
            height: 6px;
            background: #8B0000;
            margin: 20px auto 0;
        }

        /* 副标题 */
        .cover-subtitle {
            font-size: 42px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 80px;
            max-width: 850px;
        }

        /* 封面标签 */
        .cover-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        .cover-tag {
            background: #8B0000;
            color: #B8860B;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 32px;
            font-weight: 600;
        }

        /* 底部 */
        .cover-footer {
            margin-top: auto;
            padding-top: 40px;
            color: #8B0000;
            font-size: 24px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 class="cover-title">复古中国风标题</h1>

        <p class="cover-subtitle">复古中国风风格的副标题，适合传统文化类内容</p>

        <div class="cover-tags">
            <span class="cover-tag">#传统</span>
            <span class="cover-tag">#文化</span>
            <span class="cover-tag">#传承</span>
        </div>

        <div class="cover-footer">小 红 书</div>
    </div>
</body>
</html>
