<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书封面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: #FFF8E7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
        }

        #container {
            width: 1080px;
            height: 1080px;
            padding: 80px 60px;
            background: #FFFBF0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(93, 64, 55, 0.15);
            text-align: center;
        }

        /* 封面标题 */
        .cover-title {
            font-size: 96px;
            font-weight: bold;
            color: #5D4037;
            line-height: 1.3;
            margin-bottom: 50px;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
        }

        /* 副标题 */
        .cover-subtitle {
            font-size: 42px;
            color: #6D4C41;
            line-height: 1.5;
            margin-bottom: 80px;
            max-width: 850px;
        }

        /* 封面标签 */
        .cover-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
        }

        .cover-tag {
            background: #FFF3E0;
            color: #E65100;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: 600;
            border: 2px solid #FF8F00;
        }

        /* 底部 */
        .cover-footer {
            margin-top: auto;
            padding-top: 40px;
            color: #FF8F00;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1 class="cover-title">焦糖饼干标题</h1>

        <p class="cover-subtitle">温暖焦糖风格的副标题，适合生活治愈类内容</p>

        <div class="cover-tags">
            <span class="cover-tag">#生活</span>
            <span class="cover-tag">#治愈</span>
            <span class="cover-tag">#好物</span>
        </div>

        <div class="cover-footer">小红书</div>
    </div>
</body>
</html>
